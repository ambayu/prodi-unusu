# Konfigurasi Nginx untuk UNUSU Multi-Prodi
#
# Seluruh domain diarahkan ke satu aplikasi Node.js pada port 5010.
# Aplikasi menentukan tenant dari header Host, sehingga Nginx WAJIB meneruskan
# Host asli. Tanpa `proxy_set_header Host $host`, semua domain akan tampak
# sebagai localhost dan resolusi tenant gagal.
#
# Cara pakai:
#   1. Salin ke /etc/nginx/sites-available/prodi-unusu
#   2. Ganti prodi.unusu.ac.id dan daftar domain sesuai inventaris resmi
#   3. ln -s /etc/nginx/sites-available/prodi-unusu /etc/nginx/sites-enabled/
#   4. certbot --nginx -d prodi.unusu.ac.id -d unusu.ac.id -d ... (SSL per domain)
#   5. nginx -t && systemctl reload nginx

upstream unusu_prodi_app {
    server 127.0.0.1:5010;
    keepalive 32;
}

# Zona pembatas laju per alamat IP pengunjung asli.
limit_req_zone $binary_remote_addr zone=unusu_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=unusu_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name prodi.unusu.ac.id;

    # Certbot akan mengisi blok ini.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prodi.unusu.ac.id;

    # Sertifikat diisi certbot.
    ssl_certificate     /etc/letsencrypt/live/prodi.unusu.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prodi.unusu.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    access_log /var/log/nginx/unusu-prodi-access.log;
    error_log  /var/log/nginx/unusu-prodi-error.log;

    # Login dibatasi lebih ketat daripada endpoint lain.
    location = /api/v1/auth/login {
        limit_req zone=unusu_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://unusu_prodi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    location /api/ {
        limit_req zone=unusu_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://unusu_prodi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Berkas publik hasil unggahan.
    location /uploads/media/ {
        proxy_pass http://unusu_prodi_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Aset statis hasil build Vite. Disajikan Nginx langsung agar lebih cepat.
    location /assets/ {
        alias /var/www/prodi-unusu/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://unusu_prodi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# =========================================================
# Website program studi
#
# Satu blok server untuk seluruh domain prodi. Aplikasi yang menentukan tenant
# dari Host, jadi Nginx cukup meneruskan semuanya ke upstream yang sama.
# Tambahkan hostname baru ke baris server_name saat prodi baru diaktifkan.
# =========================================================

server {
    listen 80;
    listen [::]:80;
    server_name tif.unusu.ac.id iko.unusu.ac.id sin.unusu.ac.id
                pgsd.unusu.ac.id manajemen.unusu.ac.id
                agribisnis.unusu.ac.id itp.unusu.ac.id bdp.unusu.ac.id
                ilmugizi.unusu.ac.id ankes.unusu.ac.id
                piaud.unusu.ac.id pai.unusu.ac.id hki.unusu.ac.id studislam.unusu.ac.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tif.unusu.ac.id iko.unusu.ac.id sin.unusu.ac.id
                pgsd.unusu.ac.id manajemen.unusu.ac.id
                agribisnis.unusu.ac.id itp.unusu.ac.id bdp.unusu.ac.id
                ilmugizi.unusu.ac.id ankes.unusu.ac.id
                piaud.unusu.ac.id pai.unusu.ac.id hki.unusu.ac.id studislam.unusu.ac.id;

    # Sertifikat per domain. Certbot membuat satu blok per hostname; berkas ini
    # hanya contoh. Jika memakai satu sertifikat wildcard, arahkan ke
    # /etc/letsencrypt/live/unusu.ac.id/fullchain.pem.
    ssl_certificate     /etc/letsencrypt/live/unusu.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unusu.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;
    access_log /var/log/nginx/unusu-prodi-public-access.log;

    location /api/ {
        limit_req zone=unusu_api burst=40 nodelay;
        proxy_pass http://unusu_prodi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/media/ {
        proxy_pass http://unusu_prodi_app;
        proxy_set_header Host $host;
        expires 30d;
    }

    location /assets/ {
        alias /var/www/prodi-unusu/dist/assets/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://unusu_prodi_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
